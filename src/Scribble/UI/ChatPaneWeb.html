<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>Scribble</title>
<style>
  :root {
    --bg: #1a1b1e;
    --bg2: #212226;
    --card: #2b2c31;
    --card2: #34353b;
    --border: #34353a;
    --text: #e8e8ec;
    --dim: #9898a0;
    --accent: #5c8fff;
    --accent-soft: rgba(92, 143, 255, 0.14);
    --error: #ff7676;
    --ok: #3ddc97;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #3c3d43; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4a4b52; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px 8px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #logo { width: 32px; height: 32px; flex-shrink: 0; }
  .head-text { flex: 1; min-width: 0; }
  #draft {
    color: var(--dim);
    font-size: 11.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #draft.linked { color: var(--accent); }
  nav { display: flex; gap: 4px; flex-shrink: 0; }
  nav button {
    background: transparent;
    color: var(--dim);
    border: none;
    border-radius: 7px;
    padding: 5px 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  nav button:hover { background: var(--card); color: var(--text); }
  #topicBar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 11.5px;
    color: var(--dim);
  }
  #topic {
    flex: 1;
    min-width: 0;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 7px;
    font: inherit;
  }
  #topic:disabled { opacity: 0.65; }

  #tray {
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 0 8px;
  }
  #tray.on { display: flex; }
  .tchip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 6px 5px 8px;
    max-width: 240px;
    animation: fadein 0.15s ease-out;
  }
  .tchip .thumb {
    width: 34px;
    height: 34px;
    border-radius: 7px;
    object-fit: cover;
    flex-shrink: 0;
  }
  .tchip .glyph {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .tchip .t { min-width: 0; }
  .tchip .t1 {
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }
  .tchip .t2 {
    font-size: 10px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }
  .tchip .tx {
    background: none;
    border: none;
    color: var(--dim);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .tchip .tx:hover { color: var(--error); background: var(--card2); }
  .qcard {
    background: var(--card);
    border: 1px solid var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    margin: 8px 0;
    animation: fadein 0.15s ease-out;
  }
  .qcard.done { opacity: 0.55; pointer-events: none; }
  .qtitle { font-weight: 600; font-size: 13px; }
  .qhint { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .qlabel { font-size: 12px; margin-top: 10px; }
  .qopts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 5px;
  }
  .qopt {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
  }
  .qopt:hover { border-color: var(--accent); }
  .qopt.sel {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .qtext {
    width: 100%;
    margin-top: 6px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11.5px;
    color: var(--text);
    outline: none;
  }
  .qtext:focus { border-color: var(--accent); }
  .qactions { display: flex; gap: 8px; margin-top: 12px; }
  .qgo {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
  }
  .qgo:hover { filter: brightness(1.1); }
  .qskip {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--dim);
    cursor: pointer;
  }
  .qskip:hover { color: var(--text); border-color: var(--dim); }
  .askopts {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 9px;
  }
  .askopt {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 7px 10px;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .askopt:hover { border-color: var(--accent); }
  .askopt.sel {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .asklabel { display: block; font-size: 12px; font-weight: 600; }
  .askdesc {
    display: block;
    color: var(--dim);
    font-size: 10.5px;
    margin-top: 2px;
  }
  .tchip.warn {
    background: rgba(245, 196, 81, 0.10);
    border-color: rgba(245, 196, 81, 0.45);
  }
  .tchip.warn .glyph {
    background: rgba(245, 196, 81, 0.18);
    color: #f5c451;
  }
  .tchip.warn .t2 { color: #f5c451; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 6px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
  }
  .msg { max-width: 100%; animation: fadein 0.18s ease-out; }
  .msg .body {
    white-space: pre-wrap;
    overflow-wrap: break-word;
    -webkit-user-select: text;
    user-select: text;
  }
  .msg.user { align-self: flex-end; max-width: 88%; }
  .msg.user .body {
    background: var(--accent-soft);
    border: 1px solid rgba(92, 143, 255, 0.25);
    border-radius: 14px 14px 4px 14px;
    padding: 8px 12px;
  }
  .msg.ai { align-self: stretch; }
  .msg.ai .who {
    color: var(--dim);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .msg.ai .body { padding-right: 6px; }
  .msg.welcome .body {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--dim);
    font-size: 12.5px;
  }
  .msg.welcome .body b { color: var(--text); }
  .act {
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: var(--dim);
    font-size: 11.5px;
    animation: fadein 0.15s ease-out;
    -webkit-user-select: text;
    user-select: text;
  }
  .act::before { content: "\2022"; flex-shrink: 0; }
  .act.draft { color: var(--accent); }
  .act.error {
    color: var(--error);
    background: rgba(255, 118, 118, 0.08);
    border-radius: 8px;
    padding: 6px 10px;
    white-space: pre-wrap;
  }
  #typing { display: none; align-items: flex-end; gap: 8px; padding: 4px 2px; }
  #typing.on { display: flex; }
  #typing .dots { display: flex; gap: 4px; padding-bottom: 6px; }
  #typing .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dim);
    animation: pulse 1.2s infinite ease-in-out;
  }
  #typing .dots span:nth-child(2) { animation-delay: 0.18s; }
  #typing .dots span:nth-child(3) { animation-delay: 0.36s; }
  #typing canvas {
    image-rendering: pixelated;
    animation: palbob 1.1s infinite ease-in-out;
  }
  @keyframes palbob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }

  /* Rich assistant output: markdown blocks built as DOM nodes only. */
  .msg .body.md { white-space: normal; }
  .md p { white-space: pre-wrap; margin: 0 0 8px; }
  .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 10px 0 6px;
    line-height: 1.3;
    font-weight: 700;
  }
  .md h1 { font-size: 16px; }
  .md h2 { font-size: 14.5px; }
  .md h3 { font-size: 13.5px; }
  .md h4 { font-size: 13px; color: var(--dim); }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; white-space: pre-wrap; }
  .md ul ul, .md ol ol, .md ul ol, .md ol ul { margin-bottom: 0; }
  .md blockquote {
    margin: 0 0 8px;
    padding: 4px 10px;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
    white-space: pre-wrap;
  }
  .md hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }
  .md code {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0 4px;
    font: 12px/1.5 Consolas, "Cascadia Mono", monospace;
  }
  .md pre {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin: 0 0 8px;
    overflow-x: auto;
    font: 12px/1.5 Consolas, "Cascadia Mono", monospace;
    white-space: pre;
  }
  .md pre code { background: none; border: none; padding: 0; }
  .md .tblwrap { overflow-x: auto; margin: 0 0 8px; }
  .md table {
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 60%;
  }
  .md th, .md td {
    border: 1px solid var(--border);
    padding: 4px 9px;
    text-align: left;
    vertical-align: top;
  }
  .md th {
    background: var(--card);
    font-weight: 600;
    white-space: nowrap;
  }
  .md tr:nth-child(even) td { background: rgba(255, 255, 255, 0.02); }
  .md .mlink {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: help;
  }

  footer {
    flex-shrink: 0;
    padding: 8px 14px 10px;
    background: var(--bg);
  }
  #composerCard {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 8px 8px 8px;
    transition: border-color 0.15s;
  }
  #btnPlus {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
    border-radius: 9px;
    width: 30px;
    height: 30px;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s, color 0.12s;
  }
  #btnPlus:hover { background: var(--card2); color: var(--text); }
  #btnPlus.open { background: var(--card2); color: var(--accent); }
  footer { position: relative; }
  #plusMenu {
    position: absolute;
    left: 14px;
    bottom: 100%;
    margin-bottom: -2px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    min-width: 200px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    z-index: 20;
    animation: fadein 0.12s ease-out;
  }
  #plusMenu button {
    background: none;
    border: none;
    color: var(--text);
    font: inherit;
    font-size: 12.5px;
    text-align: left;
    padding: 8px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  #plusMenu button:hover { background: var(--card2); }
  #plusMenu[hidden] { display: none; }
  #composerCard:focus-within { border-color: var(--accent); }
  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font: inherit;
    max-height: 120px;
    line-height: 1.45;
    -webkit-user-select: text;
    user-select: text;
  }
  #input::placeholder { color: #6a6b72; }
  #btnSend {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    width: 34px;
    height: 30px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.12s;
  }
  #btnSend:hover { filter: brightness(1.12); }
  #btnSend.stop { background: var(--card2); color: var(--error); }
  #bottomRow {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
  }
  #model {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 8px;
    font: inherit;
    font-size: 11.5px;
    max-width: 55%;
    cursor: pointer;
    outline: none;
  }
  #model:disabled { opacity: 0.5; }
  #visionBadge {
    display: none;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    border: 1px solid rgba(92, 143, 255, 0.4);
    border-radius: 6px;
    padding: 1px 6px;
  }
  #visionBadge.on { display: inline-block; }
  #status {
    flex: 1;
    text-align: right;
    color: var(--dim);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status.error { color: var(--error); }

  body.dropping::after {
    content: "Drop emails or files to add them as context";
    position: fixed;
    inset: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--accent);
    border-radius: 14px;
    background: rgba(92, 143, 255, 0.10);
    color: var(--accent);
    font-weight: 600;
    pointer-events: none;
    z-index: 10;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<header>
  <svg id="logo" viewBox="0 0 40 40" aria-label="Scribble logo">
    <rect x="1" y="1" width="38" height="38" rx="9" fill="#5c8fff"/>
    <rect x="9" y="13" width="22" height="15" rx="2"
          fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M9 13 L20 21.5 L31 13" fill="none" stroke="#fff"
          stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>
  <div class="head-text">
    <div id="draft">Say "create a draft" to open one. Scribble can never send.</div>
  </div>
  <nav>
    <button id="btnClearChat"
            title="Clears everything: the conversation, working set, files, images, and the draft link">Clear chat</button>
    <button id="btnSettings" title="Settings">Settings</button>
  </nav>
</header>

<div id="topicBar">
  <label for="topic">Topic</label>
  <select id="topic" title="Local Topic for this chat"></select>
</div>

<main id="chat"></main>

<footer>
  <div id="tray"></div>
  <div id="plusMenu" hidden>
    <button id="menuAddEmail">&#9993;&#xFE0E;&nbsp; Add selected emails</button>
    <button id="menuAddFiles">&#128206;&#xFE0E;&nbsp; Add files or pictures</button>
    <button id="menuShare">&#8644;&#xFE0E;&nbsp; Share last answer to Scribble apps</button>
    <button id="menuAddShared">&#8645;&#xFE0E;&nbsp; Add shared Scribble context</button>
    <button id="menuCopyDiag">&#9741;&#xFE0E;&nbsp; Copy diagnostics</button>
  </div>
  <div id="composerCard">
    <button id="btnPlus" title="Add emails, files, or pictures to the context">+</button>
    <textarea id="input" rows="1" placeholder="Message Scribble..." maxlength="4000"></textarea>
    <button id="btnSend" title="Send">&#8593;</button>
  </div>
  <div id="bottomRow">
    <select id="model" title="Active model"></select>
    <span id="visionBadge">VISION</span>
    <span id="status">Starting...</span>
  </div>
</footer>

<script>
(function () {
  "use strict";
  var api = window.chrome && window.chrome.webview;
  var chat = document.getElementById("chat");
  var input = document.getElementById("input");
  var btnSend = document.getElementById("btnSend");
  var statusEl = document.getElementById("status");
  var draftEl = document.getElementById("draft");
  var modelEl = document.getElementById("model");
  var topicEl = document.getElementById("topic");
  var visionBadge = document.getElementById("visionBadge");
  var tray = document.getElementById("tray");
  var typing = null;
  var busy = false;
  var modelVision = {};
  var hostMode = "outlook";
  var topicLocked = false;

  function post(type, data) {
    if (!api) { return; }
    var payload = data || {};
    payload.type = type;
    api.postMessage(JSON.stringify(payload));
  }

  function el(tag, cls) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    return node;
  }

  function scrollDown() {
    chat.scrollTop = chat.scrollHeight;
  }

  // Pixel pal: a little sprite that works away while the model
  // thinks. Pure canvas pixels — no external assets, no HTML from
  // dynamic text.
  var palTimer = null;
  var palFrame = 0;
  var palCanvas = null;
  var PAL_SCALE = 4;
  var palColors = {
    B: "#5c8fff", D: "#3f6cd1", W: "#ffffff", K: "#22242a",
    Y: "#f5c451", G: "#3ddc97", M: "#6a6b72"
  };
  var palFrames = [
    [
      "......Y......",
      "......D......",
      "..BBBBBBBBB..",
      "..BWWBBBWWB..",
      "..BWKBBBKWB..",
      "..BBBBBBBBB..",
      "...BDDDDDB...",
      "....BBBBB....",
      "..B..BBB..B..",
      "..BB.....BB..",
      "...MMMMMMM...",
      "..MMMMMMMMM.."
    ],
    [
      "......G......",
      "......D......",
      "..BBBBBBBBB..",
      "..BWWBBBWWB..",
      "..BWKBBBKWB..",
      "..BBBBBBBBB..",
      "...BDDDDDB...",
      "....BBBBB....",
      ".....BBB.....",
      "..BB.....BB..",
      "..BMMMMMMMB..",
      "..MMMMMMMMM.."
    ],
    [
      "......Y......",
      "......D......",
      "..BBBBBBBBB..",
      "..BBBBBBBBB..",
      "..BDBBBBBDB..",
      "..BBBBBBBBB..",
      "...BDDDDDB...",
      "....BBBBB....",
      "..B..BBB..B..",
      "..BB.....BB..",
      "...MMMMMMM...",
      "..MMMMMMMMM.."
    ]
  ];
  var palCycle = [0, 1, 0, 2, 1];

  function drawPal(frameIndex) {
    if (!palCanvas) { return; }
    var rows = palFrames[palCycle[frameIndex % palCycle.length]];
    var ctx = palCanvas.getContext("2d");
    ctx.clearRect(0, 0, palCanvas.width, palCanvas.height);
    for (var y = 0; y < rows.length; y++) {
      for (var x = 0; x < rows[y].length; x++) {
        var color = palColors[rows[y].charAt(x)];
        if (!color) { continue; }
        ctx.fillStyle = color;
        ctx.fillRect(
          x * PAL_SCALE, y * PAL_SCALE, PAL_SCALE, PAL_SCALE);
      }
    }
  }

  function startPal() {
    if (palTimer) { return; }
    palFrame = 0;
    drawPal(0);
    palTimer = setInterval(function () {
      palFrame++;
      drawPal(palFrame);
    }, 260);
  }

  function stopPal() {
    if (palTimer) {
      clearInterval(palTimer);
      palTimer = null;
    }
  }

  function ensureTyping() {
    if (!typing) {
      typing = el("div", "");
      typing.id = "typing";
      palCanvas = document.createElement("canvas");
      palCanvas.width = 13 * PAL_SCALE;
      palCanvas.height = 12 * PAL_SCALE;
      typing.appendChild(palCanvas);
      var dots = el("div", "dots");
      dots.appendChild(el("span"));
      dots.appendChild(el("span"));
      dots.appendChild(el("span"));
      typing.appendChild(dots);
    }
    chat.appendChild(typing);
  }

  // All dynamic text is inserted via textContent / text nodes only —
  // model and mailbox content is never parsed as HTML.
  function addUser(text) {
    var msg = el("div", "msg user");
    var body = el("div", "body");
    body.textContent = text;
    msg.appendChild(body);
    chat.appendChild(msg);
    scrollDown();
  }

  // ------------------------------------------------------------------
  // Rich text rendering. Markdown from the model is parsed locally and
  // built exclusively out of createElement/textContent DOM nodes, so
  // model output is never interpreted as HTML. Links never navigate:
  // they render as styled text with the URL shown on hover.
  // ------------------------------------------------------------------

  function appendInline(text, node) {
    var remaining = text;
    var pattern = new RegExp(
      "(`[^`\\n]+`)" +
      "|(\\*\\*[^*\\s](?:[^*\\n]|\\*(?!\\*))*?\\*\\*)" +
      "|(__[^_\\s](?:[^_\\n]|_(?!_))*?__)" +
      "|(\\*[^*\\s][^*\\n]*?\\*)" +
      "|(\\[[^\\]\\n]+\\]\\([^)\\s]+\\))");
    while (remaining) {
      var match = pattern.exec(remaining);
      if (!match) {
        node.appendChild(document.createTextNode(remaining));
        return;
      }
      if (match.index > 0) {
        node.appendChild(
          document.createTextNode(remaining.slice(0, match.index)));
      }
      var token = match[0];
      if (match[1]) {
        var code = document.createElement("code");
        code.textContent = token.slice(1, -1);
        node.appendChild(code);
      } else if (match[2] || match[3]) {
        var strong = document.createElement("strong");
        appendInline(token.slice(2, -2), strong);
        node.appendChild(strong);
      } else if (match[4]) {
        var em = document.createElement("em");
        em.textContent = token.slice(1, -1);
        node.appendChild(em);
      } else {
        var close = token.indexOf("](");
        var link = el("span", "mlink");
        link.textContent = token.slice(1, close);
        link.title = token.slice(close + 2, -1);
        node.appendChild(link);
      }
      remaining = remaining.slice(match.index + token.length);
    }
  }

  function isTableRow(line) {
    return line.indexOf("|") >= 0 && /\S/.test(line);
  }

  function isTableSeparator(line) {
    return /^\s*\|?\s*:?-{2,}[\s:|-]*\|?\s*$/.test(line) &&
      line.indexOf("-") >= 0;
  }

  function splitTableRow(line) {
    var trimmed = line.replace(/^\s*\|/, "").replace(/\|\s*$/, "");
    return trimmed.split("|").map(function (cell) {
      return cell.trim();
    });
  }

  function tableAlignments(line) {
    return splitTableRow(line).map(function (cell) {
      var left = cell.charAt(0) === ":";
      var right = cell.charAt(cell.length - 1) === ":";
      if (left && right) { return "center"; }
      if (right) { return "right"; }
      return "";
    });
  }

  function renderMarkdown(md, container) {
    var lines = md.replace(/\r\n?/g, "\n").split("\n");
    var i = 0;
    var match;
    while (i < lines.length) {
      var line = lines[i];
      if (!/\S/.test(line)) { i++; continue; }
      if (/^\s*```/.test(line)) {
        var codeLines = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) {
          codeLines.push(lines[i]);
          i++;
        }
        i++;
        var pre = document.createElement("pre");
        var preCode = document.createElement("code");
        preCode.textContent = codeLines.join("\n");
        pre.appendChild(preCode);
        container.appendChild(pre);
        continue;
      }
      match = /^\s{0,3}(#{1,4})\s+(.*)$/.exec(line);
      if (match) {
        var heading = document.createElement(
          "h" + match[1].length);
        appendInline(match[2].replace(/\s*#+\s*$/, ""), heading);
        container.appendChild(heading);
        i++;
        continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        container.appendChild(document.createElement("hr"));
        i++;
        continue;
      }
      if (/^\s*>\s?/.test(line)) {
        var quoted = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          quoted.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        var quote = document.createElement("blockquote");
        appendInline(quoted.join("\n"), quote);
        container.appendChild(quote);
        continue;
      }
      if (isTableRow(line) &&
          i + 1 < lines.length &&
          isTableSeparator(lines[i + 1])) {
        var aligns = tableAlignments(lines[i + 1]);
        var wrap = el("div", "tblwrap");
        var table = document.createElement("table");
        var thead = document.createElement("thead");
        var headRow = document.createElement("tr");
        splitTableRow(line).forEach(function (cell, index) {
          var th = document.createElement("th");
          if (aligns[index]) { th.style.textAlign = aligns[index]; }
          appendInline(cell, th);
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);
        var tbody = document.createElement("tbody");
        i += 2;
        while (i < lines.length && isTableRow(lines[i])) {
          if (isTableSeparator(lines[i])) { i++; continue; }
          var bodyRow = document.createElement("tr");
          splitTableRow(lines[i]).forEach(function (cell, index) {
            var td = document.createElement("td");
            if (aligns[index]) { td.style.textAlign = aligns[index]; }
            appendInline(cell, td);
            bodyRow.appendChild(td);
          });
          tbody.appendChild(bodyRow);
          i++;
        }
        table.appendChild(tbody);
        wrap.appendChild(table);
        container.appendChild(wrap);
        continue;
      }
      var listMatch = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/.exec(line);
      if (listMatch) {
        var ordered = /\d/.test(listMatch[2].charAt(0));
        var list = document.createElement(ordered ? "ol" : "ul");
        var sublist = null;
        while (i < lines.length) {
          var itemMatch =
            /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/.exec(lines[i]);
          if (!itemMatch) { break; }
          var item = document.createElement("li");
          appendInline(itemMatch[3], item);
          if (itemMatch[1].length >= 2) {
            if (!sublist) {
              sublist = document.createElement(
                /\d/.test(itemMatch[2].charAt(0)) ? "ol" : "ul");
              if (list.lastChild) {
                list.lastChild.appendChild(sublist);
              } else {
                list.appendChild(sublist);
              }
            }
            sublist.appendChild(item);
          } else {
            sublist = null;
            list.appendChild(item);
          }
          i++;
        }
        container.appendChild(list);
        continue;
      }
      var paragraph = [];
      while (i < lines.length &&
             /\S/.test(lines[i]) &&
             !/^\s*```/.test(lines[i]) &&
             !/^\s{0,3}#{1,4}\s+/.test(lines[i]) &&
             !/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^(\s*)([-*+]|\d{1,3}[.)])\s+/.test(lines[i]) &&
             !(isTableRow(lines[i]) &&
               i + 1 < lines.length &&
               isTableSeparator(lines[i + 1]))) {
        paragraph.push(lines[i]);
        i++;
      }
      var p = document.createElement("p");
      appendInline(paragraph.join("\n"), p);
      container.appendChild(p);
    }
  }

  function addAssistant(text, ranges, md) {
    if (typeof md === "string" && /\S/.test(md)) {
      var richMsg = el("div", "msg ai");
      var richWho = el("div", "who");
      richWho.textContent = "Scribble";
      var richBody = el("div", "body md");
      renderMarkdown(md, richBody);
      richMsg.appendChild(richWho);
      richMsg.appendChild(richBody);
      chat.appendChild(richMsg);
      scrollDown();
      return;
    }
    var msg = el("div", "msg ai");
    var who = el("div", "who");
    who.textContent = "Scribble";
    var body = el("div", "body");
    var list = (ranges || []).slice().sort(function (a, b) {
      return a.s - b.s;
    });
    var pos = 0;
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      if (typeof r.s !== "number" || typeof r.l !== "number") { continue; }
      if (r.s < pos || r.s + r.l > text.length) { continue; }
      if (r.s > pos) {
        body.appendChild(document.createTextNode(text.slice(pos, r.s)));
      }
      var strong = document.createElement("strong");
      strong.textContent = text.slice(r.s, r.s + r.l);
      body.appendChild(strong);
      pos = r.s + r.l;
    }
    if (pos < text.length) {
      body.appendChild(document.createTextNode(text.slice(pos)));
    }
    msg.appendChild(who);
    msg.appendChild(body);
    chat.appendChild(msg);
    scrollDown();
  }

  function addActivity(text, kind) {
    var line = el("div", "act" + (kind ? " " + kind : ""));
    line.textContent = text;
    chat.appendChild(line);
    scrollDown();
  }

  function addWelcome() {
    var msg = el("div", "msg ai welcome");
    var body = el("div", "body");
    function line(bold, rest) {
      var b = document.createElement("b");
      b.textContent = bold;
      body.appendChild(b);
      body.appendChild(document.createTextNode(rest + "\n"));
    }
    if (hostMode === "excel") {
      body.appendChild(document.createTextNode(
        "Chat with your workbook - Scribble never saves, deletes, or sends anything.\n\n"));
      line("+", " adds the current selection, files, or pictures");
      body.appendChild(document.createTextNode(
        "Ask about sheets, ranges, formulas, or data.\n"));
      line("\"put this in a draft sheet\"", " writes the Scribble Draft sheet - never saved");
      line("\"email this to ...\"", " opens an unsent Outlook draft");
      line("\"put this in powerpoint\"", " appends marked draft slides");
    } else if (hostMode === "powerpoint") {
      body.appendChild(document.createTextNode(
        "Chat with your presentation - Scribble never saves, deletes, or sends anything.\n\n"));
      line("+", " adds the current slide, files, or pictures");
      body.appendChild(document.createTextNode(
        "Ask about slides, structure, or speaker notes.\n"));
      line("\"add slides about ...\"", " appends marked draft slides - never saved");
      line("\"email these slides to ...\"", " opens an unsent Outlook draft");
      line("\"put this in excel\"", " writes the Scribble Draft sheet");
    } else if (hostMode === "word") {
      body.appendChild(document.createTextNode(
        "Chat with your document - Scribble never saves, deletes, or sends anything.\n\n"));
      line("+", " adds the selected text, files, or pictures");
      body.appendChild(document.createTextNode(
        "Ask about the document, its structure, or its wording.\n"));
      line("\"write the revised text to a draft\"", " opens a new unsaved draft document");
      line("\"email this to ...\"", " opens an unsent Outlook draft");
      line("\"put this in excel / powerpoint\"", " drafts into the other apps");
    } else {
      body.appendChild(document.createTextNode(
        "Chat with your mailbox - local models, nothing is ever sent.\n\n"));
      line("/search", " a person or topic to build a working set");
      line("+", " adds selected emails, files, or pictures to the context");
      body.appendChild(document.createTextNode(
        "Or drag emails, attachments, or files straight in.\n"));
      body.appendChild(document.createTextNode(
        "Ask about emails, attachments, images, or invites.\n"));
      line("\"create a draft\"", " writes one - it always opens unsent");
    }
    msg.appendChild(body);
    chat.appendChild(msg);
    scrollDown();

  function applyMode(host) {
    hostMode = host === "excel" ||
      host === "powerpoint" ||
      host === "word"
      ? host
      : "outlook";
    var addLabel = document.getElementById("menuAddEmail");
    if (hostMode === "excel") {
      addLabel.textContent = "▦︎  Add current selection";
    } else if (hostMode === "powerpoint") {
      addLabel.textContent = "▤︎  Add current slide";
    } else if (hostMode === "word") {
      addLabel.textContent = "▥︎  Add selected text";
    } else {
      addLabel.textContent = "✉︎  Add selected emails";
    }
  }

  function setBusy(value) {
    busy = value;
    btnSend.textContent = value ? "■" : "↑";
    btnSend.title = value ? "Stop" : "Send";
    btnSend.classList.toggle("stop", value);
    modelEl.disabled = value;
    topicEl.disabled = value || topicLocked;
    if (value) {
      ensureTyping();
      typing.classList.add("on");
      startPal();
      scrollDown();
    } else {
      stopPal();
      if (typing && typing.parentNode) {
        typing.classList.remove("on");
        typing.parentNode.removeChild(typing);
      }
    }
  }

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("error", !!isError);
  }

  function setModels(items, current) {
    modelVision = {};
    while (modelEl.firstChild) { modelEl.removeChild(modelEl.firstChild); }
    for (var i = 0; i < (items || []).length; i++) {
      var item = items[i];
      modelVision[item.id] = !!item.vision;
      var option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.id + (item.vision ? "  (vision)" : "");
      modelEl.appendChild(option);
    }
    if (current) { modelEl.value = current; }
    updateVisionBadge();
  }

  function setTopics(items, current, unavailable) {
    while (topicEl.firstChild) { topicEl.removeChild(topicEl.firstChild); }
    var none = document.createElement("option");
    none.value = "";
    none.textContent = "None";
    topicEl.appendChild(none);
    for (var i = 0; i < (items || []).length; i++) {
      var item = items[i] || {};
      if (!item.id || !item.name) { continue; }
      var option = document.createElement("option");
      option.value = item.id;
      option.textContent = item.name + (item.available === false
        ? " (folder unavailable)" : "");
      topicEl.appendChild(option);
    }
    if (unavailable && current) {
      var missing = document.createElement("option");
      missing.value = current;
      missing.textContent = "Topic unavailable - clear chat";
      topicEl.appendChild(missing);
    }
    topicEl.value = current || "";
    topicEl.disabled = busy || topicLocked || !!unavailable;
  }

  function setTopicLock(locked, unavailable) {
    topicLocked = !!locked;
    topicEl.disabled = busy || topicLocked || !!unavailable;
  }

  function updateVisionBadge() {
    visionBadge.classList.toggle(
      "on",
      !!modelVision[modelEl.value]);
  }

  function setContext(items) {
    while (tray.firstChild) { tray.removeChild(tray.firstChild); }
    var list = items || [];
    tray.classList.toggle("on", list.length > 0);
    for (var i = 0; i < list.length; i++) {
      tray.appendChild(buildChip(list[i]));
    }
    if (list.length > 1) {
      var clearAll = el("div", "tchip");
      var clearBtn = document.createElement("button");
      clearBtn.className = "tx";
      clearBtn.textContent = "Clear all";
      clearBtn.title = "Remove all context";
      clearBtn.addEventListener("click", function () {
        post("clearContext");
      });
      clearAll.appendChild(clearBtn);
      tray.appendChild(clearAll);
    }
  }

  function buildChip(item) {
    var chip = el("div", "tchip");
    if (item.warn) { chip.classList.add("warn"); }
    var tip = (item.title || "") +
      (item.subtitle ? "\n" + item.subtitle : "");
    if (tip) {
      chip.title = item.warn ? "Warning\n" + tip : tip;
    }
    if (item.kind === "image" &&
        item.thumb &&
        item.thumb.indexOf("data:image/") === 0) {
      var img = document.createElement("img");
      img.className = "thumb";
      img.src = item.thumb;
      img.alt = "";
      chip.appendChild(img);
    } else {
      var glyph = el("div", "glyph");
      glyph.textContent = item.warn
        ? "\u26A0"
        : (item.kind === "email" || item.kind === "selected"
          ? "\u2709"
          : (item.kind === "image" ? "\u25A3" : "\u25A4"));
      chip.appendChild(glyph);
    }
    var t = el("div", "t");
    var t1 = el("div", "t1");
    t1.textContent = item.title || "";
    var t2 = el("div", "t2");
    t2.textContent = item.subtitle || "";
    t.appendChild(t1);
    t.appendChild(t2);
    chip.appendChild(t);
    var remove = document.createElement("button");
    remove.className = "tx";
    remove.textContent = "\u00D7";
    remove.title = "Remove from context";
    (function (kind, index) {
      remove.addEventListener("click", function () {
        post("removeContext", { kind: kind, index: index });
      });
    })(item.kind, item.index);
    chip.appendChild(remove);
    return chip;
  }

  function clearChat() {
    while (chat.firstChild) { chat.removeChild(chat.firstChild); }
    stopPal();
    typing = null;
    palCanvas = null;
    suggestCard = null;
    askUserCard = null;
    streamBubble = null;
    streamBody = null;
  }

  var streamBubble = null;
  var streamBody = null;

  function streamDelta(text) {
    if (!busy || !text) { return; }
    if (!streamBubble) {
      streamBubble = el("div", "msg ai");
      var who = el("div", "who");
      who.textContent = "Scribble";
      streamBody = el("div", "body");
      streamBubble.appendChild(who);
      streamBubble.appendChild(streamBody);
      chat.appendChild(streamBubble);
    }
    streamBody.textContent += text;
    scrollDown();
  }

  function streamEnd() {
    if (streamBubble && streamBubble.parentNode === chat) {
      chat.removeChild(streamBubble);
    }
    streamBubble = null;
    streamBody = null;
  }

  var suggestCard = null;
  var askUserCard = null;

  function showSuggest(questions) {
    if (suggestCard && suggestCard.parentNode === chat) {
      chat.removeChild(suggestCard);
    }
    suggestCard = null;
    var card = el("div", "qcard");
    var title = el("div", "qtitle");
    title.textContent = "Suggest a response";
    card.appendChild(title);
    var hint = el("div", "qhint");
    hint.textContent =
      "Answer these to shape the reply draft, or skip straight " +
      "to a draft. The draft always opens unsent for your review.";
    card.appendChild(hint);
    var controls = [];
    (questions || []).slice(0, 3).forEach(function (q) {
      if (!q || !q.text) { return; }
      var label = el("div", "qlabel");
      label.textContent = q.text;
      card.appendChild(label);
      var optsRow = el("div", "qopts");
      var state = { selected: "" };
      var input = document.createElement("input");
      input.type = "text";
      input.className = "qtext";
      input.placeholder = "Or type your own answer (optional)";
      (q.options || []).slice(0, 4).forEach(function (opt) {
        var chipBtn = document.createElement("button");
        chipBtn.className = "qopt";
        chipBtn.textContent = opt;
        chipBtn.addEventListener("click", function () {
          var was = chipBtn.classList.contains("sel");
          Array.prototype.forEach.call(
            optsRow.children,
            function (child) { child.classList.remove("sel"); });
          if (was) {
            state.selected = "";
          } else {
            chipBtn.classList.add("sel");
            state.selected = opt;
            input.value = "";
          }
        });
        optsRow.appendChild(chipBtn);
      });
      if (optsRow.children.length > 0) {
        card.appendChild(optsRow);
      }
      input.addEventListener("input", function () {
        if (input.value) {
          Array.prototype.forEach.call(
            optsRow.children,
            function (child) { child.classList.remove("sel"); });
          state.selected = "";
        }
      });
      card.appendChild(input);
      controls.push({
        q: q.text,
        getAnswer: function () {
          return (input.value || state.selected || "").trim();
        }
      });
    });
    var actions = el("div", "qactions");
    var go = document.createElement("button");
    go.className = "qgo";
    go.textContent = "Create draft";
    var skip = document.createElement("button");
    skip.className = "qskip";
    skip.textContent = "Skip questions";
    function submit(withAnswers) {
      if (busy) { return; }
      var answers = [];
      if (withAnswers) {
        controls.forEach(function (c) {
          var a = c.getAnswer();
          if (a) { answers.push({ question: c.q, answer: a }); }
        });
      }
      card.classList.add("done");
      post("suggestAnswers", { answers: answers });
    }
    go.addEventListener("click", function () { submit(true); });
    skip.addEventListener("click", function () { submit(false); });
    actions.appendChild(go);
    actions.appendChild(skip);
    card.appendChild(actions);
    chat.appendChild(card);
    suggestCard = card;
    scrollDown();
  }

  function showAskUser(question, reason, options) {
    if (askUserCard && askUserCard.parentNode === chat) {
      chat.removeChild(askUserCard);
    }
    var card = el("div", "qcard");
    var title = el("div", "qtitle");
    title.textContent = "Help Scribble get this right";
    card.appendChild(title);
    if (reason) {
      var hint = el("div", "qhint");
      hint.textContent = reason;
      card.appendChild(hint);
    }
    var label = el("div", "qlabel");
    label.textContent = question || "What should Scribble use?";
    card.appendChild(label);

    var choices = el("div", "askopts");
    (options || []).slice(0, 4).forEach(function (rawOption) {
      var option = typeof rawOption === "string"
        ? { label: rawOption, description: "" }
        : (rawOption || {});
      if (!option.label) { return; }
      var button = document.createElement("button");
      button.type = "button";
      button.className = "askopt";
      var optionLabel = el("span", "asklabel");
      optionLabel.textContent = option.label;
      button.appendChild(optionLabel);
      if (option.description) {
        var description = el("span", "askdesc");
        description.textContent = option.description;
        button.appendChild(description);
      }
      button.addEventListener("click", function () {
        if (card.classList.contains("done")) { return; }
        button.classList.add("sel");
        card.classList.add("done");
        post("askUserAnswer", { answer: option.label });
      });
      choices.appendChild(button);
    });
    if (choices.children.length > 0) {
      card.appendChild(choices);
    }

    var input = document.createElement("input");
    input.type = "text";
    input.className = "qtext";
    input.maxLength = 240;
    input.placeholder = "Or type a different answer";
    card.appendChild(input);
    var actions = el("div", "qactions");
    var answer = document.createElement("button");
    answer.type = "button";
    answer.className = "qgo";
    answer.textContent = "Use my answer";
    function submitCustom() {
      var value = input.value.replace(/\s+/g, " ").trim();
      if (!value || card.classList.contains("done")) { return; }
      card.classList.add("done");
      post("askUserAnswer", { answer: value });
    }
    answer.addEventListener("click", submitCustom);
    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        submitCustom();
      }
    });
    actions.appendChild(answer);
    card.appendChild(actions);
    chat.appendChild(card);
    askUserCard = card;
    scrollDown();
    input.focus();
  }

  function dismissAskUser() {
    if (askUserCard) {
      askUserCard.classList.add("done");
    }
  }

  function handle(m) {
    if (!m || !m.type) { return; }
    switch (m.type) {
      case "user": addUser(m.text || ""); break;
      case "assistant": addAssistant(m.text || "", m.bold, m.md); break;
      case "activity": addActivity(m.text || "", m.kind); break;
      case "suggest": showSuggest(m.questions); break;
      case "askUser":
        showAskUser(m.question, m.reason, m.options);
        break;
      case "dismissAskUser": dismissAskUser(); break;
      case "delta": streamDelta(m.text || ""); break;
      case "deltaEnd": streamEnd(); break;
      case "status": setStatus(m.text, m.error); break;
      case "busy": setBusy(!!m.value); break;
      case "draft":
        draftEl.textContent = m.text || "";
        draftEl.classList.toggle("linked", !!m.linked);
        break;
      case "models": setModels(m.items, m.current); break;
      case "topics": setTopics(
        m.items, m.current, m.unavailable); break;
      case "topicLock": setTopicLock(
        m.locked, m.unavailable); break;
      case "context": setContext(m.items); break;
      case "restorePrompt":
        input.value = m.text || "";
        autoGrow();
        input.focus();
        break;
      case "clear": clearChat(); addWelcome(); break;
      case "welcome": addWelcome(); break;
      case "mode": applyMode(m.host); break;
    }
  }

  function sendMessage() {
    if (busy) { post("stop"); return; }
    var text = input.value.replace(/\s+$/, "");
    if (!text) { return; }
    post("send", { text: text });
    input.value = "";
    autoGrow();
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  btnSend.addEventListener("click", sendMessage);
  modelEl.addEventListener("change", function () {
    updateVisionBadge();
    post("setModel", { model: modelEl.value });
  });
  topicEl.addEventListener("change", function () {
    post("setTopic", { topicId: topicEl.value });
  });
  document.getElementById("btnClearChat")
    .addEventListener("click", function () { post("newChat"); });
  document.getElementById("btnSettings")
    .addEventListener("click", function () { post("openSettings"); });
  var plusMenu = document.getElementById("plusMenu");
  var btnPlus = document.getElementById("btnPlus");
  function closePlusMenu() {
    plusMenu.hidden = true;
    btnPlus.classList.remove("open");
  }
  btnPlus.addEventListener("click", function (event) {
    event.stopPropagation();
    plusMenu.hidden = !plusMenu.hidden;
    btnPlus.classList.toggle("open", !plusMenu.hidden);
  });
  document.addEventListener("click", closePlusMenu);
  document.getElementById("menuAddEmail")
    .addEventListener("click", function () {
      closePlusMenu();
      post("addEmail");
    });
  document.getElementById("menuAddFiles")
    .addEventListener("click", function () {
      closePlusMenu();
      post("addFiles");
    });
  document.getElementById("menuShare")
    .addEventListener("click", function () {
      closePlusMenu();
      post("shareAnswer");
    });
  document.getElementById("menuAddShared")
    .addEventListener("click", function () {
      closePlusMenu();
      post("addShared");
    });
  document.getElementById("menuCopyDiag")
    .addEventListener("click", function () {
      closePlusMenu();
      post("copyDiag");
    });

  // Drag-and-drop: the drop gesture is forwarded to the host. Outlook
  // email drags (virtual .msg files, or drags exposing no files) map to
  // "add the current Outlook selection", matching the pre-web behavior;
  // real file drops are handed over with their paths.
  var dropDepth = 0;
  document.addEventListener("dragover", function (event) {
    event.preventDefault();
  });
  document.addEventListener("dragenter", function (event) {
    event.preventDefault();
    dropDepth++;
    document.body.classList.add("dropping");
  });
  document.addEventListener("dragleave", function () {
    dropDepth--;
    if (dropDepth <= 0) {
      dropDepth = 0;
      document.body.classList.remove("dropping");
    }
  });
  document.addEventListener("drop", function (event) {
    event.preventDefault();
    dropDepth = 0;
    document.body.classList.remove("dropping");
    var files = (event.dataTransfer && event.dataTransfer.files) ||
      [];
    var hasMsg = false;
    for (var i = 0; i < files.length; i++) {
      if (/\.msg$/i.test(files[i].name)) { hasMsg = true; break; }
    }
    if (hasMsg || files.length === 0) {
      post("emailDrop");
      return;
    }
    if (api && api.postMessageWithAdditionalObjects) {
      api.postMessageWithAdditionalObjects(
        JSON.stringify({ type: "fileDrop" }),
        files);
    }
  });

  if (api) {
    api.addEventListener("message", function (event) {
      var m = event.data;
      if (typeof m === "string") {
        try { m = JSON.parse(m); } catch (parseError) { return; }
      }
      handle(m);
    });
  }

  post("ready");
  input.focus();
})();
</script>
</body>
</html>
