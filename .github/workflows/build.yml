name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # Code signing is optional: when the SIGNING_PFX secret is absent
    # the signing steps are skipped and the build stays unsigned.
    # scripts/New-SigningCert.ps1 explains how to set the secrets up.
    env:
      SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore stable COM strong-name key
        shell: pwsh
        run: ./scripts/Restore-StrongNameKey.ps1

      # Every build gets a unique, user-checkable file version
      # (2.0.<run number>): Settings shows it as "Installed
      # version", so "do I have the latest build" is answerable.
      # AssemblyVersion stays 1.1.0.0 - the COM registration in the
      # installer pins it, so only the file version may move.
      - name: Stamp build version
        shell: pwsh
        run: |
          $file = "src/Scribble/Properties/AssemblyInfo.cs"
          (Get-Content $file) -replace 'AssemblyFileVersion\("[^"]+"\)', 'AssemblyFileVersion("2.0.${{ github.run_number }}.0")' | Set-Content $file

      - name: Restore NuGet packages
        run: msbuild Scribble.sln /t:Restore /p:Configuration=Release

      - name: Build solution
        run: msbuild Scribble.sln /m /p:Configuration=Release

      - name: Verify WebView2 payload in build output
        shell: pwsh
        run: |
          $bin = "src\Scribble\bin\Release"
          Get-ChildItem $bin -Recurse -Include *.dll |
            ForEach-Object { Write-Host $_.FullName.Substring((Resolve-Path $bin).Path.Length + 1) }
          foreach ($required in @(
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll"
          )) {
            if (-not (Test-Path (Join-Path $bin $required))) {
              throw "Missing WebView2 assembly in build output: $required"
            }
          }
          $loaders = Get-ChildItem $bin -Recurse -Filter WebView2Loader.dll
          if ($loaders.Count -lt 1) {
            throw "No WebView2Loader.dll found anywhere in the build output."
          }
          $x86 = $loaders | Where-Object { $_.FullName -match "win-x86" }
          if (-not $x86 -and -not (Test-Path (Join-Path $bin "WebView2Loader.dll"))) {
            throw "No x86-capable WebView2Loader.dll (Outlook is often 32-bit)."
          }

      - name: Verify browser host and extension payload
        shell: pwsh
        run: |
          $hostBin = "src\Scribble.BrowserHost\bin\Release"
          foreach ($required in @(
            "ScribbleBrowserHost.exe",
            "Scribble.dll"
          )) {
            if (-not (Test-Path (Join-Path $hostBin $required))) {
              throw "Missing browser-host build output: $required"
            }
          }

          $extension = "src\Scribble.BrowserExtension"
          foreach ($required in @(
            "manifest.json",
            "background.js",
            "sidepanel.html",
            "sidepanel.css",
            "sidepanel.js",
            "README.md"
          )) {
            if (-not (Test-Path (Join-Path $extension $required))) {
              throw "Missing browser extension asset: $required"
            }
          }
          try {
            $manifest = Get-Content (Join-Path $extension "manifest.json") -Raw |
              ConvertFrom-Json
            $nativeManifest = Get-Content "src\Scribble.BrowserHost\com.scribble.browser.json" -Raw |
              ConvertFrom-Json
          }
          catch {
            throw "A browser manifest is not valid JSON: $($_.Exception.Message)"
          }
          if ($manifest.manifest_version -ne 3 -or
              $manifest.background.service_worker -ne "background.js" -or
              $manifest.side_panel.default_path -ne "sidepanel.html") {
            throw "The Manifest V3 browser entry points are invalid."
          }
          if ($nativeManifest.name -ne "com.scribble.browser" -or
              $nativeManifest.path -ne "ScribbleBrowserHost.exe") {
            throw "The native messaging host manifest is invalid."
          }
          foreach ($script in @("background.js", "sidepanel.js")) {
            & node --check (Join-Path $extension $script)
            if ($LASTEXITCODE -ne 0) {
              throw "JavaScript syntax validation failed: $script"
            }
          }

          $hostPath = (Resolve-Path (
            Join-Path $hostBin "ScribbleBrowserHost.exe")).Path
          function New-NativeHostProcess([string]$arguments) {
            $startInfo = New-Object Diagnostics.ProcessStartInfo
            $startInfo.FileName = $hostPath
            $startInfo.Arguments = $arguments
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardInput = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $process = New-Object Diagnostics.Process
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "Could not start the browser native host."
            }
            return $process
          }

          $allowedOrigin = "chrome-extension://olkepladbgkfkhlglooilnmalckpdada/"
          $pingProcess = New-NativeHostProcess $allowedOrigin
          $pingJson = '{"type":"ping","requestId":"ci-ping"}'
          $strictUtf8 = New-Object Text.UTF8Encoding($false, $true)
          $pingBytes = $strictUtf8.GetBytes($pingJson)
          $lengthBytes = [BitConverter]::GetBytes($pingBytes.Length)
          if (-not [BitConverter]::IsLittleEndian) {
            [Array]::Reverse($lengthBytes)
          }
          $pingProcess.StandardInput.BaseStream.Write(
            $lengthBytes, 0, $lengthBytes.Length)
          $pingProcess.StandardInput.BaseStream.Write(
            $pingBytes, 0, $pingBytes.Length)
          $pingProcess.StandardInput.Close()
          $output = New-Object IO.MemoryStream
          $outputTask = $pingProcess.StandardOutput.BaseStream.CopyToAsync($output)
          $errorTask = $pingProcess.StandardError.ReadToEndAsync()
          if (-not $pingProcess.WaitForExit(30000)) {
            $pingProcess.Kill()
            throw "The browser native host ping timed out."
          }
          [void]$outputTask.GetAwaiter().GetResult()
          $hostError = $errorTask.GetAwaiter().GetResult()
          if ($pingProcess.ExitCode -ne 0) {
            throw "The browser native host ping failed ($($pingProcess.ExitCode)): $hostError"
          }
          $responseBytes = $output.ToArray()
          if ($responseBytes.Length -lt 5) {
            throw "The browser native host returned no framed ping response."
          }
          $responseLengthBytes = New-Object byte[] 4
          [Array]::Copy($responseBytes, 0, $responseLengthBytes, 0, 4)
          if (-not [BitConverter]::IsLittleEndian) {
            [Array]::Reverse($responseLengthBytes)
          }
          $responseLength = [BitConverter]::ToInt32($responseLengthBytes, 0)
          if ($responseLength -ne ($responseBytes.Length - 4)) {
            throw "The native host did not return exactly one valid little-endian frame."
          }
          try {
            $pingResponse = $strictUtf8.GetString(
              $responseBytes, 4, $responseLength) | ConvertFrom-Json
          }
          catch {
            throw "The native host ping response is not strict UTF-8 JSON: $($_.Exception.Message)"
          }
          if ($pingResponse.ok -ne $true -or
              -not $pingResponse.PSObject.Properties["configured"] -or
              -not $pingResponse.PSObject.Properties["supportsVision"] -or
              -not $pingResponse.PSObject.Properties["version"]) {
            throw "The native host ping response is missing its public status contract."
          }
          $pingProcess.Dispose()
          $output.Dispose()

          foreach ($rejectedOrigin in @(
            "",
            "chrome-extension://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/"
          )) {
            $rejectedProcess = New-NativeHostProcess $rejectedOrigin
            $rejectedProcess.StandardInput.Close()
            if (-not $rejectedProcess.WaitForExit(10000)) {
              $rejectedProcess.Kill()
              throw "The native host waited on input from an unauthorized origin."
            }
            if ($rejectedProcess.ExitCode -ne 2) {
              throw "The native host accepted or mishandled rejected origin '$rejectedOrigin'."
            }
            $rejectedProcess.Dispose()
          }

      - name: Sign native binaries
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          ./scripts/Sign-File.ps1 -Path "src\Scribble\bin\Release\Scribble.dll"
          ./scripts/Sign-File.ps1 -Path "src\Scribble.BrowserHost\bin\Release\ScribbleBrowserHost.exe"

      - name: Run guardrail tests
        run: tests\GuardrailTests\bin\Release\GuardrailTests.exe

      - name: Run static capability scan
        shell: pwsh
        run: ./scripts/Test-Guardrails.ps1

      - name: Inspect .NET COM registration contract
        shell: powershell
        run: |
          $assembly = Resolve-Path "src\Scribble\bin\Release\Scribble.dll"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\RegAsm.exe" `
            $assembly /codebase /regfile:managed-com.reg
          $registration = Get-Content managed-com.reg -Raw
          if (-not $registration.Contains("Scribble.AddIn")) {
            throw "RegAsm did not export the add-in COM class."
          }
          if (-not $registration.Contains("PublicKeyToken=f51b005bfa6d7cc3")) {
            throw "The add-in strong-name identity changed."
          }
          if (-not $registration.Contains("Scribble.UI.ChatPane")) {
            throw "The Outlook sidebar control was not exported to COM."
          }
          if (-not $registration.Contains("Scribble.ExcelAddIn")) {
            throw "RegAsm did not export the Excel add-in COM class."
          }
          if (-not $registration.Contains("Scribble.PowerPointAddIn")) {
            throw "RegAsm did not export the PowerPoint add-in COM class."
          }
          if (-not $registration.Contains("Scribble.WordAddIn")) {
            throw "RegAsm did not export the Word add-in COM class."
          }
          if (-not $registration.Contains("Scribble.UI.OfficeChatPane")) {
            throw "The Excel/PowerPoint sidebar control was not exported to COM."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build single-file installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=2.0.${{ github.run_number }}" `
            "installer\Scribble.iss"

      - name: Sign the installer
        if: env.SIGNING_PFX != ''
        shell: pwsh
        run: |
          ./scripts/Sign-File.ps1 -Path "artifacts\ScribbleSetup.exe"

      - name: Smoke-test installer registration
        shell: powershell
        run: |
          $installer = Resolve-Path "artifacts\ScribbleSetup.exe"
          # Seed the exact file and registry shapes left by the published
          # pre-rename installer. The names are composed so retired branding
          # never becomes a current source-tree identity.
          $legacyNamespace = "Outlook" + "Local" + "AI" + "Chat"
          $legacyBrand = "AI" + "365"
          $legacyHostName = "com." + $legacyBrand.ToLowerInvariant() + ".browser"
          $seededInstallDir = Join-Path $env:LOCALAPPDATA "Programs\Scribble"
          New-Item -ItemType Directory -Path $seededInstallDir -Force | Out-Null
          foreach ($legacyFile in @(
            ($legacyNamespace + ".dll"),
            ($legacyBrand + "BrowserHost.exe"),
            ($legacyBrand + "BrowserHost.exe.config"),
            ($legacyHostName + ".json")
          )) {
            [IO.File]::WriteAllText(
              (Join-Path $seededInstallDir $legacyFile),
              "upgrade-cleanup-probe")
          }
          $legacyRegistryPaths = @(
            "Software\Microsoft\Office\Outlook\Addins\$legacyNamespace.AddIn",
            "Software\Classes\$legacyNamespace.AddIn",
            "Software\Classes\$legacyNamespace.ChatPane",
            "Software\Microsoft\Office\Excel\Addins\$legacyBrand.ExcelAddIn",
            "Software\Classes\$legacyBrand.ExcelAddIn",
            "Software\Microsoft\Office\PowerPoint\Addins\$legacyBrand.PowerPointAddIn",
            "Software\Classes\$legacyBrand.PowerPointAddIn",
            "Software\Microsoft\Office\Word\Addins\$legacyBrand.WordAddIn",
            "Software\Classes\$legacyBrand.WordAddIn",
            "Software\Classes\$legacyBrand.OfficePane"
          )
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              foreach ($legacyRegistryPath in $legacyRegistryPaths) {
                $key = $root.CreateSubKey($legacyRegistryPath)
                $key.Dispose()
              }
            }
            finally {
              $root.Dispose()
            }
          }
          $browserRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            foreach ($browser in @("Microsoft\Edge", "Google\Chrome")) {
              $key = $browserRoot.CreateSubKey(
                "Software\$browser\NativeMessagingHosts\$legacyHostName")
              $key.Dispose()
            }
          }
          finally {
            $browserRoot.Dispose()
          }

          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $installedDll = Join-Path $env:LOCALAPPDATA "Programs\Scribble\Scribble.dll"
          if (-not (Test-Path $installedDll)) {
            throw "Installed add-in DLL was not found."
          }
          $installedDir = Split-Path $installedDll
          foreach ($legacyFile in @(
            ($legacyNamespace + ".dll"),
            ($legacyBrand + "BrowserHost.exe"),
            ($legacyBrand + "BrowserHost.exe.config"),
            ($legacyHostName + ".json")
          )) {
            if (Test-Path (Join-Path $installedDir $legacyFile)) {
              throw "Installer retained a retired payload file: $legacyFile"
            }
          }
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              foreach ($legacyRegistryPath in $legacyRegistryPaths) {
                $key = $root.OpenSubKey($legacyRegistryPath)
                try {
                  if ($null -ne $key) {
                    throw "Installer retained a retired registration in $view`: $legacyRegistryPath"
                  }
                }
                finally {
                  if ($null -ne $key) { $key.Dispose() }
                }
              }
            }
            finally {
              $root.Dispose()
            }
          }
          $browserRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            foreach ($browser in @("Microsoft\Edge", "Google\Chrome")) {
              $legacyBrowserPath =
                "Software\$browser\NativeMessagingHosts\$legacyHostName"
              $key = $browserRoot.OpenSubKey($legacyBrowserPath)
              try {
                if ($null -ne $key) {
                  throw "Installer retained a retired native host: $legacyBrowserPath"
                }
              }
              finally {
                if ($null -ne $key) { $key.Dispose() }
              }
            }
          }
          finally {
            $browserRoot.Dispose()
          }
          foreach ($required in @(
            "Microsoft.Web.WebView2.Core.dll",
            "Microsoft.Web.WebView2.WinForms.dll"
          )) {
            if (-not (Test-Path (Join-Path $installedDir $required))) {
              throw "Installer did not ship $required."
            }
          }
          $installedLoaders = Get-ChildItem $installedDir -Recurse -Filter WebView2Loader.dll
          if ($installedLoaders.Count -lt 1) {
            throw "Installer did not ship any WebView2Loader.dll."
          }
          $installedHost = Join-Path $installedDir "ScribbleBrowserHost.exe"
          $installedNativeManifest = Join-Path $installedDir "com.scribble.browser.json"
          $installedExtension = Join-Path $installedDir "BrowserExtension"
          foreach ($required in @(
            $installedHost,
            $installedNativeManifest,
            (Join-Path $installedExtension "manifest.json"),
            (Join-Path $installedExtension "background.js"),
            (Join-Path $installedExtension "sidepanel.html"),
            (Join-Path $installedExtension "sidepanel.css"),
            (Join-Path $installedExtension "sidepanel.js"),
            (Join-Path $installedExtension "README.md")
          )) {
            if (-not (Test-Path $required)) {
              throw "Installer did not ship browser asset $required."
            }
          }
          try {
            $nativeManifest = Get-Content $installedNativeManifest -Raw |
              ConvertFrom-Json
            $extensionManifest = Get-Content (
              Join-Path $installedExtension "manifest.json") -Raw |
              ConvertFrom-Json
          }
          catch {
            throw "An installed browser manifest is invalid JSON: $($_.Exception.Message)"
          }
          $expectedOrigin = "chrome-extension://olkepladbgkfkhlglooilnmalckpdada/"
          $origins = @($nativeManifest.allowed_origins)
          if ($nativeManifest.name -ne "com.scribble.browser" -or
              $origins.Count -ne 1 -or
              $origins[0] -ne $expectedOrigin -or
              $extensionManifest.manifest_version -ne 3) {
            throw "Installed browser manifests do not have the expected identity."
          }
          $hostPath = [string]$nativeManifest.path
          if (-not [IO.Path]::IsPathRooted($hostPath)) {
            $hostPath = Join-Path (Split-Path $installedNativeManifest) $hostPath
          }
          if (-not (Test-Path $hostPath) -or
              -not [string]::Equals(
                (Resolve-Path $hostPath).Path,
                (Resolve-Path $installedHost).Path,
                [StringComparison]::OrdinalIgnoreCase)) {
            throw "The native manifest does not resolve to the installed host executable."
          }
          $browserRegistryRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            foreach ($nativeKeyPath in @(
              "Software\Microsoft\Edge\NativeMessagingHosts\com.scribble.browser",
              "Software\Google\Chrome\NativeMessagingHosts\com.scribble.browser"
            )) {
              $nativeKey = $browserRegistryRoot.OpenSubKey($nativeKeyPath)
              try {
                if ($null -eq $nativeKey) {
                  throw "Native host registration is missing: $nativeKeyPath"
                }
                $registeredManifest = [string]$nativeKey.GetValue("")
                if (-not (Test-Path $registeredManifest) -or
                    -not [string]::Equals(
                      (Resolve-Path $registeredManifest).Path,
                      (Resolve-Path $installedNativeManifest).Path,
                      [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Native host registration points to the wrong manifest: $nativeKeyPath"
                }
              }
              finally {
                if ($null -ne $nativeKey) { $nativeKey.Dispose() }
              }
            }
          }
          finally {
            $browserRegistryRoot.Dispose()
          }
          $assembly = [Reflection.Assembly]::LoadFrom($installedDll)
          $instance = $assembly.CreateInstance("Scribble.AddIn")
          if ($null -eq $instance) {
            throw "The installed add-in class could not be instantiated."
          }
          $clsid = "{0D6E56F9-BE2D-4B94-B5E4-4C2DB0FD13E7}"
          $paneClsid = "{14D24FA1-4342-442F-B68B-B68D7372794C}"
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              $addin = $root.OpenSubKey(
                "Software\Microsoft\Office\Outlook\Addins\Scribble.AddIn")
              if ($null -eq $addin -or $addin.GetValue("LoadBehavior") -ne 3) {
                throw "Outlook add-in registration is missing in $view."
              }
              $server = $root.OpenSubKey(
                "Software\Classes\CLSID\$clsid\InprocServer32")
              if ($null -eq $server) {
                throw "COM registration is missing in $view."
              }
              $codeBase = [string]$server.GetValue("CodeBase")
              $codeBasePath = ([Uri]$codeBase).LocalPath
              if (-not (Test-Path $codeBasePath)) {
                throw "The $view COM codebase does not resolve to the installed DLL."
              }
              $paneServer = $root.OpenSubKey(
                "Software\Classes\CLSID\$paneClsid\InprocServer32")
              if ($null -eq $paneServer) {
                throw "Sidebar COM registration is missing in $view."
              }
              if ([string]$paneServer.GetValue("Class") -ne
                  "Scribble.UI.ChatPane") {
                throw "Sidebar COM class is wrong in $view."
              }
              foreach ($suite in @(
                @("Software\Microsoft\Office\Excel\Addins\Scribble.ExcelAddIn",
                  "{C0ABFA36-9854-434D-A542-DD834938737F}",
                  "Scribble.ExcelAddIn"),
                @("Software\Microsoft\Office\PowerPoint\Addins\Scribble.PowerPointAddIn",
                  "{69FAE812-274F-43F8-8F45-1B4EB22B5248}",
                  "Scribble.PowerPointAddIn"),
                @("Software\Microsoft\Office\Word\Addins\Scribble.WordAddIn",
                  "{B49E9DB7-0C40-46A8-80A3-547626FE5331}",
                  "Scribble.WordAddIn")
              )) {
                $suiteAddin = $root.OpenSubKey($suite[0])
                if ($null -eq $suiteAddin -or
                    $suiteAddin.GetValue("LoadBehavior") -ne 3) {
                  throw "Suite add-in registration $($suite[0]) is missing in $view."
                }
                $suiteAddin.Dispose()
                $suiteServer = $root.OpenSubKey(
                  "Software\Classes\CLSID\$($suite[1])\InprocServer32")
                if ($null -eq $suiteServer -or
                    [string]$suiteServer.GetValue("Class") -ne $suite[2]) {
                  throw "Suite COM class $($suite[2]) is missing in $view."
                }
                $suiteServer.Dispose()
              }
              $officePane = $root.OpenSubKey(
                "Software\Classes\CLSID\{BC9047E7-9AFE-4F75-BBBC-27241B1DE2FA}\InprocServer32")
              if ($null -eq $officePane -or
                  [string]$officePane.GetValue("Class") -ne
                  "Scribble.UI.OfficeChatPane") {
                throw "The Excel/PowerPoint sidebar registration is missing in $view."
              }
              $officePane.Dispose()
            }
            finally {
              if ($null -ne $addin) { $addin.Dispose() }
              if ($null -ne $server) { $server.Dispose() }
              if ($null -ne $paneServer) { $paneServer.Dispose() }
              $root.Dispose()
            }
          }

          # GitHub-hosted runners execute as a non-interactive elevated service.
          # Windows intentionally ignores per-user COM classes in that context.
          # Register the installed DLL temporarily per-machine to exercise the
          # same managed class factory in both bitnesses, then remove it.
          # Remove the already-verified per-user class keys first so they cannot
          # mask the temporary machine registration in the runner context.
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              $root.DeleteSubKeyTree(
                "Software\Classes\CLSID\$clsid",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\Scribble.AddIn",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\CLSID\$paneClsid",
                $false)
              $root.DeleteSubKeyTree(
                "Software\Classes\Scribble.ChatPane",
                $false)
            }
            finally {
              $root.Dispose()
            }
          }
          $regasm64 = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\RegAsm.exe"
          $regasm32 = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\RegAsm.exe"
          try {
            & $regasm64 $installedDll /codebase
            if ($LASTEXITCODE -ne 0) { throw "64-bit RegAsm failed." }
            $addin64 = New-Object -ComObject Scribble.AddIn
            if ($null -eq $addin64) { throw "64-bit COM activation failed." }
            if ([Runtime.InteropServices.Marshal]::IsComObject($addin64)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin64)
            }
          }
          finally {
            & $regasm64 $installedDll /unregister
          }
          try {
            & $regasm32 $installedDll /codebase
            if ($LASTEXITCODE -ne 0) { throw "32-bit RegAsm failed." }
            $powershell32 = "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe"
            $smoke32 = Join-Path $env:RUNNER_TEMP "smoke-com-32.ps1"
            @'
          $addin32 = New-Object -ComObject Scribble.AddIn
          if ($null -eq $addin32) { throw "32-bit COM activation failed." }
          if ([Runtime.InteropServices.Marshal]::IsComObject($addin32)) {
            [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin32)
          }
          '@ | Set-Content $smoke32 -Encoding ASCII
            & $powershell32 -NoProfile -File $smoke32
            if ($LASTEXITCODE -ne 0) { throw "32-bit COM activation failed." }
          }
          finally {
            & $regasm32 $installedDll /unregister
          }

      - name: Smoke-test component selection
        shell: powershell
        run: |
          # Reinstall with only the Excel component: the other apps'
          # registration must be removed, Excel's must remain.
          $installer = Resolve-Path "artifacts\ScribbleSetup.exe"
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/COMPONENTS=excel" -Wait
          foreach ($view in @(
            [Microsoft.Win32.RegistryView]::Registry64,
            [Microsoft.Win32.RegistryView]::Registry32
          )) {
            $root = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
              [Microsoft.Win32.RegistryHive]::CurrentUser,
              $view)
            try {
              foreach ($gone in @(
                "Software\Microsoft\Office\Outlook\Addins\Scribble.AddIn",
                "Software\Microsoft\Office\PowerPoint\Addins\Scribble.PowerPointAddIn",
                "Software\Microsoft\Office\Word\Addins\Scribble.WordAddIn"
              )) {
                $key = $root.OpenSubKey($gone)
                if ($null -ne $key) {
                  $key.Dispose()
                  throw "Deselected component registration $gone survived in $view."
                }
              }
              $excel = $root.OpenSubKey(
                "Software\Microsoft\Office\Excel\Addins\Scribble.ExcelAddIn")
              if ($null -eq $excel -or $excel.GetValue("LoadBehavior") -ne 3) {
                throw "Excel-only install lost the Excel registration in $view."
              }
              $excel.Dispose()
              $pane = $root.OpenSubKey(
                "Software\Classes\CLSID\{BC9047E7-9AFE-4F75-BBBC-27241B1DE2FA}\InprocServer32")
              if ($null -eq $pane) {
                throw "Excel-only install lost the shared sidebar COM class in $view."
              }
              $pane.Dispose()
            }
            finally {
              $root.Dispose()
            }
          }
          $browserRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            foreach ($gone in @(
              "Software\Microsoft\Edge\NativeMessagingHosts\com.scribble.browser",
              "Software\Google\Chrome\NativeMessagingHosts\com.scribble.browser"
            )) {
              $key = $browserRoot.OpenSubKey($gone)
              if ($null -ne $key) {
                $key.Dispose()
                throw "Deselected browser registration $gone survived."
              }
            }
          }
          finally {
            $browserRoot.Dispose()
          }
          $installedDir = Join-Path $env:LOCALAPPDATA "Programs\Scribble"
          foreach ($gone in @(
            (Join-Path $installedDir "ScribbleBrowserHost.exe"),
            (Join-Path $installedDir "com.scribble.browser.json"),
            (Join-Path $installedDir "BrowserExtension")
          )) {
            if (Test-Path $gone) {
              throw "Deselected browser component file survived: $gone"
            }
          }
          # Restore the full install so later steps and artifacts
          # reflect the default everything-selected state.
          Start-Process $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/COMPONENTS=outlook,excel,powerpoint,word,browser" -Wait

      - name: Smoke-test browser uninstall cleanup
        shell: powershell
        run: |
          $installedDir = Join-Path $env:LOCALAPPDATA "Programs\Scribble"
          $uninstaller = Join-Path $installedDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Scribble uninstaller was not found."
          }
          Start-Process $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $browserRoot = [Microsoft.Win32.RegistryKey]::OpenBaseKey(
            [Microsoft.Win32.RegistryHive]::CurrentUser,
            [Microsoft.Win32.RegistryView]::Registry32)
          try {
            foreach ($gone in @(
              "Software\Microsoft\Edge\NativeMessagingHosts\com.scribble.browser",
              "Software\Google\Chrome\NativeMessagingHosts\com.scribble.browser"
            )) {
              $key = $browserRoot.OpenSubKey($gone)
              if ($null -ne $key) {
                $key.Dispose()
                throw "Uninstall left native host registration $gone behind."
              }
            }
          }
          finally {
            $browserRoot.Dispose()
          }
          foreach ($gone in @(
            (Join-Path $installedDir "ScribbleBrowserHost.exe"),
            (Join-Path $installedDir "com.scribble.browser.json"),
            (Join-Path $installedDir "BrowserExtension")
          )) {
            if (Test-Path $gone) {
              throw "Uninstall left browser component path behind: $gone"
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScribbleSetup
          path: artifacts/ScribbleSetup.exe
          if-no-files-found: error

      - name: Publish latest installer from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Latest
          body: |
            Built automatically from the latest commit on main.
            Version: 2.0.${{ github.run_number }} (shown as
            "Installed version" in Scribble Settings after updating)
            Commit: ${{ github.sha }}
          files: artifacts/ScribbleSetup.exe
          make_latest: true
          draft: false
          prerelease: false

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/ScribbleSetup.exe
          generate_release_notes: true
